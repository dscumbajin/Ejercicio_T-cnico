# ========================
# Nombre de la aplicación
# ========================
spring.application.name=authentication

# ==============================
# Configuración de la Base de Datos MySQL
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# Configuración JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================
# Logging de parámetros SQL (mostrar valores y tipos)
# ========================
spring.jpa.properties.hibernate.type.format_sql=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder.log=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicExtractor.log=true

# ========================
# Configuración de niveles de log
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.secret=MiClaveSuperSecretaParaJWT1234567890123456
